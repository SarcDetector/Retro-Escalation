name: Windows portable build

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - retro-escalation
    paths:
      - ".github/workflows/windows-portable.yml"
      - "assets/**"
      - "distribution/windows/**"
      - "docs/TESTING.md"
      - "locales/**"
      - "main.py"
      - "pyproject.toml"
      - "re_oscr/**"
      - "retro_escalation.py"
      - "tests/**"
      - "theme_assets/**"

permissions:
  contents: read

jobs:
  windows-x86-64:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install application and packager
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[pyinst]"

      - name: Run regression tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v

      - name: Build portable archive
        shell: pwsh
        run: |
          .\distribution\windows\build_retro_escalation.ps1 `
            -OutputRoot ".artifacts\windows-package" `
            -Package

      - name: Verify Live overlay package contents
        shell: pwsh
        run: |
          $root = '.artifacts\windows-package\RE-OSCR\_internal'
          $required = @(
            'assets\overlay\overlay.html',
            'assets\overlay\overlay.css',
            'assets\overlay\overlay.js',
            'PySide6\QtWebSockets.pyd',
            'PySide6\Qt6WebSockets.dll'
          )
          foreach ($relativePath in $required) {
            $path = Join-Path $root $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing Live overlay package file: $path"
            }
          }

      - name: Verify packaged startup
        shell: pwsh
        run: |
          $configDir = Join-Path $env:RUNNER_TEMP 're-oscr-package-settings'
          $env:RE_OSCR_SMOKE_CONFIG = $configDir
          @'
          import os
          import socket
          from pathlib import Path
          from re_oscr.config import OSCRSettings

          config_dir = Path(os.environ['RE_OSCR_SMOKE_CONFIG'])
          config_dir.mkdir(parents=True, exist_ok=True)
          with socket.socket() as probe:
              probe.bind(('127.0.0.1', 0))
              port = probe.getsockname()[1]
          settings = OSCRSettings(config_dir / 'RE_OSCR_settings.ini')
          settings.overlay__feed_enabled = True
          settings.overlay__feed_bind = '127.0.0.1'
          settings.overlay__feed_port = port
          settings.store_settings()
          settings._settings.sync()
          '@ | .\.venv\Scripts\python.exe -
          $process = Start-Process `
            -FilePath .\.artifacts\windows-package\RE-OSCR\RE-OSCR.exe `
            -ArgumentList @('--config_dir', $configDir, '--startup-check') `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged startup failed with exit code $($process.ExitCode)."
          }
          foreach ($name in @(
              'overlay.html', 'overlay.css', 'overlay.js',
              'overlay-config.js', 'overlay-custom.css')) {
            $path = Join-Path $configDir "overlay\$name"
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Packaged Live overlay did not generate: $path"
            }
          }

      - name: Upload Windows tester package
        uses: actions/upload-artifact@v4
        with:
          name: RE-OSCR-${{ github.sha }}-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            .artifacts/windows-package/*.zip
            .artifacts/windows-package/*.sha256
