<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-labelledby="title description">
  <title id="title">RE-OSCR — Retro Escalation feature poster</title>
  <desc id="description">A Command Console styled feature poster for RE-OSCR, an alternative frontend for the OSCR combat-log parser.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B0F"/>
      <stop offset="0.54" stop-color="#0B1116"/>
      <stop offset="1" stop-color="#121D25"/>
    </linearGradient>
    <linearGradient id="analysisFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AD3F" stop-opacity=".82"/>
      <stop offset="1" stop-color="#D4AD3F" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="overviewFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A2A" stop-opacity=".70"/>
      <stop offset="1" stop-color="#FF8A2A" stop-opacity=".05"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .display { font-family: Overpass, Arial, sans-serif; }
      .mono { font-family: 'Roboto Mono', Consolas, monospace; }
      .eyebrow { font-family: 'Roboto Mono', Consolas, monospace; font-size: 20px; font-weight: 700; letter-spacing: 2px; fill: #77DBE2; }
      .title { font-family: Overpass, Arial, sans-serif; font-size: 76px; font-weight: 700; fill: #F4EFE6; letter-spacing: -2px; }
      .subtitle { font-family: Overpass, Arial, sans-serif; font-size: 28px; font-weight: 400; fill: #AEBDC5; }
      .paneltitle { font-family: Overpass, Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #F4EFE6; }
      .body { font-family: Overpass, Arial, sans-serif; font-size: 24px; font-weight: 400; fill: #AEBDC5; }
      .small { font-family: 'Roboto Mono', Consolas, monospace; font-size: 18px; font-weight: 500; fill: #667B87; letter-spacing: .8px; }
      .stat { font-family: 'Roboto Mono', Consolas, monospace; font-size: 30px; font-weight: 700; fill: #F4EFE6; }
      .metric { font-family: 'Roboto Mono', Consolas, monospace; font-size: 19px; font-weight: 500; fill: #AEBDC5; }
    </style>
  </defs>

  <rect width="2560" height="1440" fill="url(#backdrop)"/>
  <path d="M0 0H1320L1210 116H0Z" fill="#0E161D"/>
  <path d="M1320 0H2560V116H1210Z" fill="#05080B"/>
  <rect x="0" y="116" width="2560" height="2" fill="#293944"/>

  <g opacity=".34">
    <path d="M1730 188L2510 188M1900 236L2510 236M2070 284L2510 284M2240 332L2510 332" stroke="#293944" stroke-width="2"/>
    <path d="M2470 188V630M2390 236V630M2310 284V630M2230 332V630" stroke="#293944" stroke-width="2"/>
  </g>

  <g transform="translate(92 72)">
    <rect width="14" height="14" rx="2" fill="#FF8A2A"/>
    <rect x="22" width="14" height="14" rx="2" fill="#D4AD3F"/>
    <rect x="44" width="14" height="14" rx="2" fill="#9A6BC4"/>
    <rect x="66" width="14" height="14" rx="2" fill="#4FC3CC"/>
    <rect x="88" width="14" height="14" rx="2" fill="#D94B55"/>
    <text x="132" y="16" class="small" fill="#AEBDC5">RE-OSCR // RETRO ESCALATION</text>
  </g>
  <text x="92" y="214" class="eyebrow">COMBAT LOG INTELLIGENCE // REBUILT AS A CONSOLE</text>
  <text x="88" y="308" class="title">READ THE FIGHT.</text>
  <text x="88" y="392" class="title" fill="#D4AD3F">OWN THE VIEW.</text>
  <text x="92" y="450" class="subtitle">A data-first Command Console frontend for the OSCR combat-log parser.</text>
  <text x="92" y="492" class="subtitle">Original presentation. Parser truth stays upstream.</text>

  <g transform="translate(92 566)">
    <rect width="694" height="488" rx="16" fill="#0E161D"/>
    <rect width="6" height="108" fill="#D4AD3F"/>
    <rect x="6" width="688" height="108" fill="#121D25"/>
    <text x="34" y="42" class="eyebrow">02 ANALYSIS // SIMPLE WHEN IT COUNTS</text>
    <text x="34" y="80" class="paneltitle">Fast answers. Full investigation on demand.</text>
    <text x="34" y="150" class="body">Simple view starts with core telemetry</text>
    <text x="34" y="184" class="body">and live weighted-line graphs.</text>
    <text x="34" y="246" class="body">Advanced view adds lenses, filters,</text>
    <text x="34" y="280" class="body">time cuts, detailed bars, and drill-down.</text>
    <line x1="34" y1="326" x2="660" y2="326" stroke="#293944" stroke-width="2"/>
    <text x="34" y="370" class="eyebrow" fill="#D4AD3F">ANALYSIS WORKBENCH</text>
    <text x="34" y="408" class="body">GROUP · REVERSE · EXCLUDE</text>
    <text x="34" y="448" class="small">DISPLAY-ONLY // MODIFIED VIEWS ARE CLEARLY LABELLED</text>
  </g>

  <g transform="translate(824 566)">
    <rect width="1644" height="488" rx="16" fill="#0E161D"/>
    <rect width="6" height="108" fill="#FF8A2A"/>
    <rect x="6" width="1638" height="108" fill="#121D25"/>
    <text x="36" y="42" class="eyebrow" fill="#FFB873">TELEMETRY MATRIX // DATA IS THE HERO</text>
    <text x="36" y="80" class="paneltitle">Five workspaces. One readable command surface.</text>

    <g transform="translate(36 144)">
      <rect width="486" height="72" rx="10" fill="#121D25"/>
      <rect width="5" height="72" fill="#FF8A2A"/>
      <text x="28" y="31" class="eyebrow" fill="#FFB873">01 OVERVIEW</text>
      <text x="28" y="58" class="metric">METER ROWS · CHARTS · DRILL-DOWN</text>

      <rect x="522" width="486" height="72" rx="10" fill="#121D25"/>
      <rect x="522" width="5" height="72" fill="#D4AD3F"/>
      <text x="550" y="31" class="eyebrow" fill="#E8C96A">02 ANALYSIS</text>
      <text x="550" y="58" class="metric">CORE TO EXPERT TELEMETRY</text>

      <rect x="1044" width="486" height="72" rx="10" fill="#121D25"/>
      <rect x="1044" width="5" height="72" fill="#9A6BC4"/>
      <text x="1072" y="31" class="eyebrow" fill="#C7A4E5">03 LEAGUE</text>
      <text x="1072" y="58" class="metric">STANDINGS · LOGS · PARSES</text>

      <rect y="92" width="486" height="72" rx="10" fill="#121D25"/>
      <rect width="5" y="92" height="72" fill="#4FC3CC"/>
      <text x="28" y="123" class="eyebrow">04 SETTINGS</text>
      <text x="28" y="150" class="metric">CORE · LIVE · TABLE COLUMNS</text>

      <rect x="522" y="92" width="486" height="72" rx="10" fill="#121D25"/>
      <rect x="522" y="92" width="5" height="72" fill="#D94B55"/>
      <text x="550" y="123" class="eyebrow" fill="#F18C94">05 LIVE PARSER</text>
      <text x="550" y="150" class="metric">LIVE COMBAT TELEMETRY</text>

      <rect x="1044" y="92" width="486" height="72" rx="10" fill="#121D25"/>
      <text x="1072" y="123" class="eyebrow">LEGACY, PRESERVED</text>
      <text x="1072" y="150" class="metric">OSCR-UI LEGACY REMAINS SELECTABLE</text>
    </g>

    <g transform="translate(36 344)">
      <text class="small" x="0" y="0">PLAYER</text><text class="small" x="420" y="0">DPS</text><text class="small" x="600" y="0">TOTAL DAMAGE</text><text class="small" x="950" y="0">ACCURACY</text><text class="small" x="1220" y="0">ATTACKS</text>
      <rect x="0" y="20" width="1510" height="42" rx="8" fill="#121D25"/>
      <rect x="0" y="20" width="1120" height="42" rx="8" fill="url(#analysisFill)"/>
      <rect x="0" y="20" width="5" height="42" fill="#D4AD3F"/>
      <text x="22" y="48" class="metric" fill="#F4EFE6">Operator // selected</text><text x="420" y="48" class="metric" fill="#F4EFE6">523,014.13</text><text x="600" y="48" class="metric">37,970,825.62</text><text x="950" y="48" class="metric">99.67%</text><text x="1220" y="48" class="metric">2,737</text>
      <rect x="0" y="76" width="1510" height="42" rx="8" fill="#121D25"/>
      <rect x="0" y="76" width="790" height="42" rx="8" fill="url(#overviewFill)"/>
      <rect x="0" y="76" width="5" height="42" fill="#FF8A2A"/>
      <text x="22" y="104" class="metric">↳ Broadside Beam Support</text><text x="420" y="104" class="metric">104,719.02</text><text x="600" y="104" class="metric">7,610,909.71</text><text x="950" y="104" class="metric">100.00%</text><text x="1220" y="104" class="metric">729</text>
    </g>
  </g>

  <g transform="translate(92 1102)">
    <rect width="2376" height="212" rx="16" fill="#0B1116"/>
    <rect width="2376" height="4" fill="#4FC3CC"/>
    <text x="34" y="48" class="eyebrow">BUILT TO TRAVEL</text>
    <text x="34" y="94" class="paneltitle">Windows ZIP · Linux portable archive · PyPI / pipx</text>
    <text x="34" y="142" class="body">Keep settings yours. Keep parser data honest. Keep the combat readable.</text>
    <line x1="34" y1="170" x2="2342" y2="170" stroke="#293944" stroke-width="2"/>
    <text x="34" y="198" class="small">GPL-3.0 COMMUNITY FRONTEND // STO-OSCR PARSER UNMODIFIED // COMMAND CONSOLE IS THE DEFAULT EXPERIENCE</text>
  </g>

  <g transform="translate(92 1362)">
    <rect width="460" height="8" rx="4" fill="#FF8A2A"/><rect x="476" width="460" height="8" rx="4" fill="#D4AD3F"/><rect x="952" width="460" height="8" rx="4" fill="#9A6BC4"/><rect x="1428" width="460" height="8" rx="4" fill="#4FC3CC"/><rect x="1904" width="460" height="8" rx="4" fill="#D94B55"/>
  </g>
</svg>
